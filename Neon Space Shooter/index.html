<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            /* Very dark blue-black */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        .health-bar-container {
            margin-top: 10px;
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        .health-bar {
            width: 100%;
            height: 100%;
            background: #f0f;
            box-shadow: 0 0 10px #f0f;
            transition: width 0.2s;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #menu h1 {
            font-size: 60px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        #menu h3 {
            color: #fff;
            margin-bottom: 40px;
            font-weight: normal;
        }

        #menu button {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            width: 300px;
            transition: all 0.2s;
            font-family: inherit;
            text-shadow: 0 0 5px #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #menu button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        #menu button small {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="ui">
        <div class="score">SCORE: <span id="scoreVal">0</span></div>
        <div class="health-bar-container">
            <div class="health-bar" id="healthBar"></div>
        </div>
    </div>

    <div id="menu">
        <h1>NEON SPACE SHOOTER</h1>
        <h3>Select Difficulty</h3>
        <button onclick="startGame(1)">Level 1<br><small>Slow & Steady</small></button>
        <button onclick="startGame(2)">Level 2<br><small>Standard</small></button>
        <button onclick="startGame(3)">Level 3<br><small>Heavy Resistance</small></button>
        <button onclick="startGame(4)">Level 4<br><small>Insane</small></button>
        <button onclick="startGame(5)">Level 5<br><small>Neon Nightmare</small></button>

        <div style="margin-top: 20px; display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="superFirepower" style="width: 20px; height: 20px; cursor: pointer;">
            <label for="superFirepower"
                style="color: #0ff; font-size: 18px; cursor: pointer; text-shadow: 0 0 5px #0ff;">Enable Super Firepower
                (Instakill)</label>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * NEON SPACE SHOOTER
         */

        // --- Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Constants ---
        const COLORS = {
            bg: '#050510',
            player: '#0ff', // Cyan
            playerBullet: '#0ff',
            enemySoldier: '#f00', // Red
            enemyRaider: '#f0f', // Magenta
            enemyTank: '#fa0', // Orange
            enemyBullet: '#f00',
            particle: '#fff',
            text: '#fff'
        };

        const LEVELS = {
            1: { rate: 90, types: ['soldier'] },
            2: { rate: 60, types: ['soldier', 'raider'] },
            3: { rate: 45, types: ['soldier', 'raider', 'tank'] },
            4: { rate: 30, types: ['soldier', 'soldier', 'raider', 'raider', 'tank'] },
            5: { rate: 15, types: ['raider', 'tank', 'boss'] }
        };

        // --- Input Handling ---
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            r: false
        };
        const mouse = { x: width / 2, y: height / 2, down: false };

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (game) game.togglePause();
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        // --- Game Entity Classes ---
        class Vector {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; }
            mult(s) { this.x *= s; this.y *= s; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() {
                const m = this.mag();
                if (m > 0) this.mult(1 / m);
            }
        }

        class Entity {
            constructor(x, y, radius, color, velocity = { x: 0, y: 0 }) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
                this.markedForDeletion = false;
            }
            update(dt) {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
            }
        }

        class Bullet extends Entity {
            constructor(x, y, angle, speed, color) {
                super(x, y, 3, color, {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                });
                this.life = 0;
                this.maxLife = 100; // Frames approx
            }
            update(dt) {
                super.update(dt);
                this.life++;
                if (this.life > this.maxLife ||
                    this.x < 0 || this.x > width ||
                    this.y < 0 || this.y > height) {
                    this.markedForDeletion = true;
                }
            }
        }

        class Particle extends Entity {
            constructor(x, y, velocity, color, life) {
                super(x, y, Math.random() * 2 + 1, color, velocity);
                this.life = life;
                this.maxLife = life;
                this.friction = 0.95;
            }
            update(dt) {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                super.update(dt);
                this.life--;
                this.radius *= 0.95;
                if (this.life <= 0) this.markedForDeletion = true;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life / this.maxLife;
                super.draw(ctx);
                ctx.globalAlpha = 1.0;
            }
        }

        class Powerup extends Entity {
            constructor(x, y) {
                super(x, y, 10, '#0f0');
                this.life = 600; // 10 seconds
            }
            update(dt) {
                this.life--;
                if (this.life <= 0) this.markedForDeletion = true;
                // Wobble effect
                this.radius = 10 + Math.sin(this.life * 0.1) * 2;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P', 0, 0);

                ctx.restore();
            }
        }

        class Enemy extends Entity {
            constructor(x, y, type) {
                let radius, color, speed, health, score;
                switch (type) {
                    case 'boss':
                        radius = 60; color = '#f00'; speed = 1.0; health = 1000; score = 1000;
                        break;
                    case 'raider': // Fast, weak
                        radius = 10; color = COLORS.enemyRaider; speed = 3; health = 10; score = 20;
                        break;
                    case 'tank': // Slow, strong
                        radius = 25; color = COLORS.enemyTank; speed = 0.5; health = 150; score = 50;
                        break;
                    case 'soldier': // Standard
                    default:
                        radius = 15; color = COLORS.enemySoldier; speed = 1.5; health = 30; score = 10;
                        break;
                }
                super(x, y, radius, color);
                this.type = type;
                this.baseSpeed = speed;
                this.health = health;
                this.scoreValue = score;
                this.maxHealth = health;
            }

            update(dt, player) {
                // Simple follow player behavior
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.velocity.x = Math.cos(angle) * this.baseSpeed;
                this.velocity.y = Math.sin(angle) * this.baseSpeed;

                super.update(dt);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                if (this.type === 'boss') {
                    // Boss Shape
                    ctx.beginPath();
                    ctx.moveTo(this.radius, 0);
                    for (let i = 1; i < 8; i++) {
                        let a = i * Math.PI * 2 / 8;
                        ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Boss Health Bar
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-this.radius, -this.radius - 20, this.radius * 2, 5);
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(-this.radius, -this.radius - 20, this.radius * 2 * (this.health / this.maxHealth), 5);

                } else if (this.type === 'raider') {
                    ctx.rotate(Math.atan2(this.velocity.y, this.velocity.x));
                    ctx.moveTo(this.radius, 0);
                    ctx.lineTo(-this.radius, this.radius / 2);
                    ctx.lineTo(-this.radius, -this.radius / 2);
                    ctx.fill();
                } else if (this.type === 'tank') {
                    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // --- Game State ---
        class Game {
            constructor() {
                this.entities = []; // Enemies, Bullets
                this.particles = [];
                this.score = 0;
                this.lastTime = 0;
                this.screenShake = 0;
                this.lastBossScore = 0;
                this.paused = false;
                this.started = false;
                this.level = 1;
                this.damageMultiplier = false;

                this.spawnTimer = 0;
                this.spawnRate = 60; // Frames

                // Player
                this.player = {
                    x: width / 2,
                    y: height / 2,
                    radius: 15,
                    vx: 0,
                    vy: 0,
                    friction: 0.9,
                    accel: 0.5,
                    angle: 0,
                    maxSpeed: 8,
                    turretAngle: 0,
                    lastShot: 0,
                    fireRate: 8,
                    weaponLevel: 1,
                    health: 100,
                    maxHealth: 100
                };
            }

            shake(amount) {
                this.screenShake = amount;
            }

            togglePause() {
                this.paused = !this.paused;
                if (!this.paused) {
                    this.lastTime = performance.now();
                }
            }

            spawnParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5;
                    this.particles.push(new Particle(
                        x, y,
                        { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed },
                        color,
                        Math.random() * 30 + 20
                    ));
                }
            }

            spawnEnemy() {
                // Boss Check
                const hasBoss = this.entities.some(e => e instanceof Enemy && e.type === 'boss');
                if (!hasBoss && this.score > 0 && this.score % 1000 < 50 && this.score > this.lastBossScore) {
                    this.entities.push(new Enemy(width / 2, -100, 'boss'));
                    this.lastBossScore = this.score + 500; // Next boss check offset
                    return;
                }

                const types = ['soldier', 'soldier', 'soldier', 'raider', 'raider', 'tank'];
                const type = types[Math.floor(Math.random() * types.length)];

                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -50 : width + 50;
                    y = Math.random() * height;
                } else {
                    x = Math.random() * width;
                    y = Math.random() < 0.5 ? -50 : height + 50;
                }

                this.entities.push(new Enemy(x, y, type));
            }

            checkCollisions() {
                const bullets = this.entities.filter(e => e instanceof Bullet);
                const enemies = this.entities.filter(e => e instanceof Enemy);
                const powerups = this.entities.filter(e => e instanceof Powerup);

                // Bullets hit Enemies
                for (let b of bullets) {
                    if (b.markedForDeletion) continue;
                    for (let e of enemies) {
                        if (e.markedForDeletion) continue;

                        const dx = b.x - e.x;
                        const dy = b.y - e.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < e.radius + b.radius) {
                            e.health -= this.damageMultiplier ? 9999 : 10;
                            b.markedForDeletion = true;
                            this.spawnParticles(b.x, b.y, 5, e.color);

                            if (e.health <= 0) {
                                e.markedForDeletion = true;
                                this.score += e.scoreValue;
                                document.getElementById('scoreVal').innerText = this.score;
                                this.spawnParticles(e.x, e.y, 20, e.color);
                                this.shake(5);

                                // Powerup Drop (10% chance)
                                if (Math.random() < 0.1 || e.type === 'boss') {
                                    this.entities.push(new Powerup(e.x, e.y));
                                }
                            }
                            break;
                        }
                    }
                }

                // Enemies hit Player
                for (let e of enemies) {
                    if (e.markedForDeletion) continue;
                    const dx = e.x - this.player.x;
                    const dy = e.y - this.player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < e.radius + this.player.radius) {
                        e.markedForDeletion = true;
                        this.player.health -= 10;
                        document.getElementById('healthBar').style.width = this.player.health + '%';
                        this.spawnParticles(e.x, e.y, 10, '#f00');
                        this.shake(10);

                        if (this.player.health <= 0) {
                            alert('GAME OVER! Score: ' + this.score);
                            location.reload();
                        }
                    }
                }

                // Player picks up Powerup
                for (let p of powerups) {
                    if (p.markedForDeletion) continue;
                    const dx = p.x - this.player.x;
                    const dy = p.y - this.player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < p.radius + this.player.radius) {
                        p.markedForDeletion = true;
                        this.player.fireRate = Math.max(2, this.player.fireRate - 1); // Increase fire rate
                        this.score += 50;
                        document.getElementById('scoreVal').innerText = this.score;
                        this.spawnParticles(p.x, p.y, 15, '#0f0');
                    }
                }
            }

            update(dt) {
                // Screen Shake Decay
                if (this.screenShake > 0) this.screenShake *= 0.9;
                if (this.screenShake < 0.5) this.screenShake = 0;

                // Spawning
                this.spawnTimer++;
                if (this.spawnTimer > this.spawnRate) {
                    this.spawnEnemy();
                    this.spawnTimer = 0;
                    if (this.spawnRate > 20) this.spawnRate -= 0.1;
                }

                this.checkCollisions();
                if (this.screenShake < 0.5) this.screenShake = 0;

                // --- Player Logic ---
                // Movement
                let dx = 0, dy = 0;
                if (keys.w || keys.ArrowUp) dy = -1;
                if (keys.s || keys.ArrowDown) dy = 1;
                if (keys.a || keys.ArrowLeft) dx = -1;
                if (keys.d || keys.ArrowRight) dx = 1;

                if (dx !== 0 || dy !== 0) {
                    // Normalize diagonal speed
                    const mag = Math.sqrt(dx * dx + dy * dy);
                    dx /= mag; dy /= mag;
                    this.player.vx += dx * this.player.accel;
                    this.player.vy += dy * this.player.accel;

                    // Engine Particles
                    const angle = Math.atan2(this.player.vy, this.player.vx) + Math.PI;
                    if (Math.random() < 0.3) {
                        this.particles.push(new Particle(
                            this.player.x + (Math.random() - 0.5) * 10,
                            this.player.y + (Math.random() - 0.5) * 10,
                            { x: Math.cos(angle) * 2, y: Math.sin(angle) * 2 },
                            '#0aa', 10
                        ));
                    }
                }

                // Physics
                this.player.vx *= this.player.friction;
                this.player.vy *= this.player.friction;
                this.player.x += this.player.vx;
                this.player.y += this.player.vy;

                // Bounds
                if (this.player.x < this.player.radius) { this.player.x = this.player.radius; this.player.vx *= -1; }
                if (this.player.x > width - this.player.radius) { this.player.x = width - this.player.radius; this.player.vx *= -1; }
                if (this.player.y < this.player.radius) { this.player.y = this.player.radius; this.player.vy *= -1; }
                if (this.player.y > height - this.player.radius) { this.player.y = height - this.player.radius; this.player.vy *= -1; }

                // Turret Aiming
                this.player.turretAngle = Math.atan2(mouse.y - this.player.y, mouse.x - this.player.x);

                // Shooting
                if (mouse.down) {
                    if (this.player.lastShot <= 0) {
                        this.player.lastShot = this.player.fireRate;

                        // Spawn Bullet
                        this.entities.push(new Bullet(
                            this.player.x + Math.cos(this.player.turretAngle) * 20,
                            this.player.y + Math.sin(this.player.turretAngle) * 20,
                            this.player.turretAngle,
                            15,
                            COLORS.playerBullet
                        ));

                        // Recoil/Shake
                        this.shake(2);
                    }
                }
                this.player.lastShot--;

                // --- Update Entities ---
                this.entities.forEach(e => {
                    if (e instanceof Enemy) e.update(dt, this.player);
                    else e.update(dt);
                });
                this.particles.forEach(p => p.update(dt));

                // Cleanup
                this.entities = this.entities.filter(e => !e.markedForDeletion);
                this.particles = this.particles.filter(p => !p.markedForDeletion);
            }

            draw() {
                // Clear Background with trail effect for retro feel
                ctx.fillStyle = 'rgba(5, 5, 16, 0.4)';
                ctx.fillRect(0, 0, width, height);

                // Apply Screen Shake
                ctx.save();
                if (this.screenShake > 0) {
                    ctx.translate(
                        (Math.random() - 0.5) * this.screenShake,
                        (Math.random() - 0.5) * this.screenShake
                    );
                }

                // Global Glow
                ctx.globalCompositeOperation = 'lighter';

                // Draw Particles
                this.particles.forEach(p => p.draw(ctx));

                // Draw Entities (Bullets, Enemies)
                this.entities.forEach(e => e.draw(ctx));

                // Draw Player
                ctx.save();
                ctx.translate(this.player.x, this.player.y);
                ctx.rotate(this.player.turretAngle);

                // Ship Glow
                ctx.shadowColor = COLORS.player;
                ctx.shadowBlur = 15;
                ctx.strokeStyle = COLORS.player;
                ctx.lineWidth = 2;

                if (this.paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.fillRect(0, 0, width, height);
                    ctx.font = 'bold 48px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', width / 2, height / 2);
                    ctx.font = '24px Arial';
                    ctx.fillText('Press P or ESC to Resume', width / 2, height / 2 + 40);
                }

                // Ship Body
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-10, -10);
                ctx.closePath();
                ctx.stroke();

                // Turret Barrel
                ctx.beginPath();
                ctx.moveTo(5, 0);
                ctx.lineTo(25, 0);
                ctx.stroke();

                ctx.restore();

                ctx.restore(); // Restore shake
            }

            loop(timestamp) {
                let dt = timestamp - this.lastTime;
                this.lastTime = timestamp;

                if (dt > 100) dt = 100; // Cap dt

                if (!this.paused && this.started) {
                    this.update(dt);
                }
                this.draw();

                requestAnimationFrame(t => this.loop(t));
            }
        }

        const game = new Game();

        function startGame(lvl) {
            game.level = lvl;
            game.spawnRate = LEVELS[lvl].rate;
            game.started = true;
            game.damageMultiplier = document.getElementById('superFirepower').checked;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            game.lastTime = performance.now();
        }

        // Hide UI initially
        document.getElementById('ui').style.display = 'none';

        requestAnimationFrame(t => {
            game.lastTime = t;
            game.loop(t);
        });

    </script>
</body>

</html>
